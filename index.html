    const bottom=()=>`<footer class="panel-bottom"><span>NINA · 余知宴</span><span>${escapeHTML(t('footerNote'))}</span></footer>`;
    function renderWorks(){
      const visible=projects.filter(p=>filter==='all'||p.category===filter);
      return `<p class="section-label">${t('worksLabel')}</p><div class="panel-heading-row"><div><h2 class="panel-title" id="panel-title">${t('selectedWorks')}</h2><p class="panel-intro">${t('worksIntro')}</p></div><div class="project-count">08<small>${t('projects')}</small></div></div><div class="filters" role="group" aria-label="${language==='zh'?'作品分类':'Project categories'}">${['all','apps','games','web'].map(key=>`<button class="filter" data-filter="${key}" aria-pressed="${filter===key}">${t(key)}<small>${key==='all'?'08':`0${projects.filter(p=>p.category===key).length}`}</small></button>`).join('')}</div><div class="project-grid">${visible.map(p=>`<article class="project-card"><button class="project-image-button" data-project="${p.id}" aria-label="${escapeHTML(t('projectDetails')+': '+p[language].title)}">${artwork(p)}</button><div class="project-meta"><span>${escapeHTML(p[language].tag)}</span><span>${p.team?'COLLAB':'NINA'} / 0${projects.indexOf(p)+1}</span></div><div class="project-title-row"><h3>${escapeHTML(p[language].title)}</h3><button class="project-open" data-project="${p.id}" aria-label="${escapeHTML(t('projectDetails')+': '+p[language].title)}" title="${t('projectDetails')}">${external}</button></div><p>${escapeHTML(p[language].description)}</p></article>`).join('')}</div>${bottom()}`;
    }
    function renderProject(id){
      const project=projects.find(p=>p.id===id),data=project[language];
      return `<button class="back-link" data-panel="works"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5m5-5-5 5 5 5"/></svg>${t('backWorks')}</button><p class="section-label">${escapeHTML(data.tag)}</p><h2 class="panel-title" id="panel-title">${escapeHTML(data.title)}</h2><p class="panel-intro">${escapeHTML(data.description)}</p><div class="detail-layout"><div class="detail-visual">${artwork(project)}<p class="video-caption">${project.image?t('imageAlt'):t('preview')}</p></div><div class="detail-copy"><h3>${t('motivation')}</h3><p>${escapeHTML(data.why)}</p><h3>${t('features')}</h3><ul class="feature-list">${data.features.map(f=>`<li>${escapeHTML(f)}</li>`).join('')}</ul><p class="detail-note">${t(project.team?'roleTeam':'rolePersonal')}</p>${project.note?`<p class="detail-note">${t(project.note)}</p>`:''}${project.demo?`<a class="action-link" href="${project.demo}" target="_blank" rel="noopener">${t('demo')}${external}</a><p class="detail-note">${t('demoNote')}</p>`:''}</div></div>${bottom()}`;
    }
    function renderAbout(){return `<p class="section-label">${t('aboutLabel')}</p><h2 class="panel-title" id="panel-title">${t('aboutTitle')}</h2><div class="about-layout"><div><h3 class="about-statement">${escapeHTML(t('aboutStatement')).replace(/\n/g,'<br>')}</h3><p class="about-paragraph">${escapeHTML(t('aboutText')).replace(/\n/g,'<br>')}</p><div class="interest-list"><span>${language==='zh'?'游戏':'Games'}</span><span>${language==='zh'?'音乐':'Music'}</span><span>${language==='zh'?'画画':'Drawing'}</span></div><button class="text-link" data-panel="works" style="margin-top:30px">${t('exploreWorks')}${arrow}</button></div><div><section class="about-section"><h3><span class="about-index">01</span>${t('tools')}</h3><div class="tool-list"><span>ChatGPT</span><span>Gemini</span><span>Claude</span><span>Codex</span><span>Claude Code</span></div><p style="margin-top:15px">${t('toolsText')}</p></section><section class="about-section"><h3><span class="about-index">02</span>${t('interests')}</h3><p>${t('interestsText')}</p></section><section class="about-section"><h3><span class="about-index">03</span>${t('assistant')}</h3><p>${t('assistantText')}</p></section></div></div>${bottom()}`;}
    function renderJourney(){return `<p class="section-label">${t('journeyLabel')}</p><h2 class="panel-title" id="panel-title">${t('journeyTitle')}</h2><p class="panel-intro">${t('journeyIntro')}</p><div class="journey-layout"><div><video class="conference-video" controls playsinline preload="metadata" poster="assets/2050-poster.jpg" src="assets/nina-2050.mp4" aria-label="${t('videoCaption')}"></video><p class="video-caption">${t('videoCaption')}</p></div><div>${[['conference','conferenceTag','conferenceText','learn'],['hackathon','hackathonTag','hackathonText','starmap'],['ongoing','ongoingTag','ongoingText',null]].map(([title,tag,text,project])=>`<article class="timeline-item"><small>${t(tag)}</small><h3>${t(title)}</h3><p>${t(text)}</p>${project?`<button class="text-link" data-project="${project}">${t('seeProject')}${arrow}</button>`:`<button class="text-link" data-panel="works">${t('exploreWorks')}${arrow}</button>`}</article>`).join('')}</div></div>${bottom()}`;}
    function renderMenu(){return `<p class="section-label">${t('menuLabel')}</p><h2 class="panel-title" id="panel-title">${t('menuTitle')}</h2><div style="margin-top:45px">${[['about','navAbout','menuAbout'],['works','navWorks','menuWorks'],['journey','navJourney','menuJourney']].map(([key,label,description],i)=>`<section class="about-section"><button class="text-link" data-panel="${key}" style="font-size:26px;border:0;padding:0;margin-bottom:12px"><span class="about-index">0${i+1}</span>${t(label)}${arrow}</button><p>${t(description)}</p></section>`).join('')}</div>${bottom()}`;}
    function renderPanel(){const scrollTop=dialog.scrollTop;$('#panel-body').innerHTML=activeProject?renderProject(activeProject):activePanel==='works'?renderWorks():activePanel==='journey'?renderJourney():activePanel==='about'?renderAbout():renderMenu();dialog.scrollTop=scrollTop;}
    let returnFocus=null;
    function openPanel(panel,project=null){
      activePanel=panel;activeProject=project;renderPanel();
      if(!dialog.open){returnFocus=document.activeElement;dialog.showModal();$$('.experience video').forEach(v=>v.pause());}
      dialog.scrollTop=0;$('#close-panel').focus();
    }
    function closePanel(){
      $$('.conference-video').forEach(v=>v.pause());dialog.close();activePanel=null;activeProject=null;
      if(!motionPaused){if(current==='mars')safePlay($('#mars-background'));safePlay(portalVideo);}
      if(returnFocus?.isConnected)returnFocus.focus();
    }
    function updateMotionButton(){const button=$('#motion-toggle');button.setAttribute('aria-pressed',String(motionPaused));button.setAttribute('aria-label',t(motionPaused?'resumeMotion':'pauseMotion'));button.title=t(motionPaused?'resumeMotion':'pauseMotion');button.querySelector('span').textContent=t(motionPaused?'resumeMotion':'pauseMotion');button.querySelector('svg').innerHTML=motionPaused?'<path d="m5 3 7 5-7 5Z"/>':'<path d="M5 3v10M11 3v10"/>';if(motionPaused){cursor.classList.remove('is-visible');document.body.classList.remove('cursor-ready');}}
    document.addEventListener('click',event=>{
      const button=event.target.closest('button');if(!button)return;
      if(button.hasAttribute('data-language')){language=language==='zh'?'en':'zh';try{localStorage.setItem('nina-language',language);}catch{}translateDOM();render(false);if(dialog.open)renderPanel();}
      else if(button.dataset.panel)openPanel(button.dataset.panel);
      else if(button.dataset.project)openPanel('works',button.dataset.project);
      else if(button.dataset.filter){filter=button.dataset.filter;renderPanel();$(`[data-filter="${filter}"]`,dialog)?.focus();}
      else if(button.dataset.state)travel(button.dataset.state);
      else if(button.hasAttribute('data-home'))closePanel();
    });
    $('#close-panel').addEventListener('click',closePanel);
    dialog.addEventListener('cancel',event=>{event.preventDefault();closePanel();});
    portal.addEventListener('click',()=>travel());
    $('#primary-action').addEventListener('click',()=>openPanel(current==='mars'?'works':states[current].panel));
    $('#motion-toggle').addEventListener('click',()=>{motionPaused=!motionPaused;targetX=targetY=0;updateMotionButton();if(motionPaused)$$('.experience video').forEach(v=>v.pause());else{if(current==='mars')safePlay($('#mars-background'));safePlay(portalVideo);}});
    document.addEventListener('pointermove',event=>{if(!finePointer||event.pointerType==='touch')return;pointer={x:event.clientX,y:event.clientY};if(!motionPaused&&loaded&&!dialog.open){cursor.classList.add('is-visible');document.body.classList.add('cursor-ready');}if(!busy&&!motionPaused){targetY=(event.clientX/innerWidth-.5)*37.4;targetX=(event.clientY/innerHeight-.5)*-33;}});
    document.addEventListener('pointerleave',()=>{targetX=targetY=0;cursor.classList.remove('is-visible');document.body.classList.remove('cursor-ready');});
    portal.addEventListener('pointerenter',()=>cursor.classList.add('is-enter'));portal.addEventListener('pointerleave',()=>cursor.classList.remove('is-enter'));
    addEventListener('resize',resizeCanvas);
    document.addEventListener('visibilitychange',()=>{if(document.hidden)$$('.experience video').forEach(v=>v.pause());else if(loaded&&!motionPaused&&!dialog.open){if(current==='mars')safePlay($('#mars-background'));safePlay(portalVideo);}});
    reducedQuery.addEventListener('change',()=>{motionPaused=reducedQuery.matches;updateMotionButton();if(motionPaused)$$('.experience video').forEach(v=>v.pause());else{safePlay(portalVideo);if(current==='mars')safePlay($('#mars-background'));}});
    $$('.background').forEach(video=>video.addEventListener('loadedmetadata',()=>{if(video.id!=='mars-background')try{video.currentTime=Math.max(0,video.duration-.08);}catch{}}));
    for(const [id,url] of Object.entries(originalAssets)){$$(`video[src="${media[id]}"]`).forEach(video=>video.addEventListener('error',()=>{if(video.dataset.retried)return;video.dataset.retried='true';video.src=url;},{once:true}));}
    resizeCanvas();translateDOM();render(false);requestAnimationFrame(draw);runPreloader();
  })();
  </script>
  <script src="github-links.js" defer></script>
</body>
</html>
